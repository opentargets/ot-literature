[project]
name = "ot-literature"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "ontoma>=2.4.1",
    "pyspark==3.5.7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=2.3.3",
    "pytest>=9.0.3",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/literature"]

[tool.pytest.ini_options]
pythonpath = ["."]
